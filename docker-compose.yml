services:
  postgres:
    image: postgres:16-alpine
    container_name: cmg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmg}
      POSTGRES_USER: ${POSTGRES_USER:-cmg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmg-demo-pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmg} -d ${POSTGRES_DB:-cmg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.20-community
    container_name: cmg-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cmg-demo-pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  jupyter:
    image: quay.io/jupyter/scipy-notebook:python-3.11
    container_name: cmg-jupyter
    user: root
    environment:
      JUPYTER_TOKEN: cmg
      CHOWN_HOME: "yes"
      NB_UID: 1000
      NB_GID: 100
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cmg-demo-pass}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-cmg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmg-demo-pass}
      POSTGRES_DB: ${POSTGRES_DB:-cmg}
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    working_dir: /home/jovyan/work
    command:
      - bash
      - -lc
      - |
        pip install --quiet --no-cache-dir -e ".[dev]" && \
        start-notebook.sh --NotebookApp.token=cmg --NotebookApp.notebook_dir=/home/jovyan/work
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
