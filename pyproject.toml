[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiometabolic-graph"
version = "0.1.0"
description = "Reference implementation of a multi-source patient knowledge graph for cardiometabolic outcome modeling."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amit Shenoy" }]
keywords = [
    "knowledge-graph",
    "digital-therapeutics",
    "graph-neural-networks",
    "cardiometabolic",
    "clinical-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26,<2.1",
    "pyarrow>=15",
    "neo4j>=5.20",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "streamlit>=1.34",
    "plotly>=5.20",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.7",
]
# Optional open-weight LLM backend for the summarizer package. The
# Ollama backend uses stdlib HTTP and needs none of these; this extra
# is only required for the in-process HuggingFace path.
llm-local = [
    "transformers>=4.43",
    "torch>=2.2",
    "accelerate>=0.30",
]

[project.urls]
Homepage = "https://github.com/amitshenoy/cardiometabolic-graph"
Issues = "https://github.com/amitshenoy/cardiometabolic-graph/issues"

[project.scripts]
cmg-load-mimic = "etl.load_mimic:main"
cmg-load-nhanes = "etl.load_nhanes:main"
cmg-load-pathways = "etl.load_pathways:main"
cmg-build-graph = "etl.build_graph:main"
cmg-train = "models.train:main"
cmg-evaluate = "models.evaluate:main"
cmg-synth-engagement = "data.synthetic.generate_engagement_logs:main"
cmg-ablations = "models.ablations:main"
cmg-attention-figure = "explain.attention_figure:main"

[tool.setuptools]
packages = [
    "etl",
    "models",
    "explain",
    "dashboard",
    "data.synthetic",
    "cookbook",
    "summarizer",
]

[tool.setuptools.package-data]
"*" = ["*.cql", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that hit Docker services or train models",
    "integration: tests that require Neo4j or Postgres",
]
